# NeMo Agent Toolkit workflow: order-and-transport planner.
# Different models serve different roles (model routing is data, here):
#   explainer       Nemotron 3.5 Lightning 30B-A3B (tool cargo_explain_plan, reasoning off) writes the approver brief
#   content safety  Llama 3.1 Nemotron Safety Guard 8B v3 (Guardrails input/output rails in the gateway)
#   planner_guarded Nemotron 3 Super through the NeMo Guardrails gateway on :8091 (default)
#   planner       Nemotron 3 Super on build.nvidia.com (NIM API), native tool calling
#   planner_local qwen38 on this server's vLLM (OpenAI-compatible) — fallback / offline
# Run:  source ~/.config/nvidia/env && .venv/bin/nat run --config_file agent/nat_planner/planner.yml --input "<goal>"
general:
  use_uvloop: true

functions:
  cargo_list_bases: {_type: cargo_list_bases}
  cargo_make_spec: {_type: cargo_make_spec}
  cargo_solve_plan: {_type: cargo_solve_plan}
  cargo_plan_details: {_type: cargo_plan_details}
  cargo_stress_test: {_type: cargo_stress_test}
  cargo_explain_plan: {_type: cargo_explain_plan}
  cargo_airspace_status: {_type: cargo_airspace_status}
  cargo_aviation_weather: {_type: cargo_aviation_weather}

llms:
  planner_guarded:
    # the same Nemotron 3 Super, reached through the guarded gateway (api/llm_gateway.py, NeMo Guardrails IORails)
    _type: openai
    base_url: http://127.0.0.1:8091/llm/v1
    model_name: nvidia/nemotron-3-super-120b-a12b
    api_key: EMPTY
    max_tokens: 8000
    temperature: 0.2
  planner:
    _type: nim
    base_url: https://integrate.api.nvidia.com/v1
    model_name: nvidia/nemotron-3-super-120b-a12b
    api_key: ${NVIDIA_API_KEY}
    max_tokens: 8000
    temperature: 0.2
  planner_local:
    _type: openai
    base_url: http://127.0.0.1:8001/v1
    model_name: qwen38
    api_key: EMPTY
    max_tokens: 4000
    temperature: 0.2

workflow:
  _type: tool_calling_agent
  llm_name: planner_guarded
  tool_names: [cargo_list_bases, cargo_make_spec, cargo_solve_plan, cargo_plan_details, cargo_stress_test, cargo_explain_plan, cargo_airspace_status, cargo_aviation_weather]
  max_iterations: 16
  handle_tool_errors: true
  truncation_retry: {max_retries: 1, token_increment: 4000}
  max_empty_response_retries: 1
  system_prompt: |
    You are an order-and-transport planning agent for temperature-sensitive, short-shelf-life, high-value goods.
    Turn the user's goal into a plan spec, solve it, and PROPOSE a plan. You cannot book, order or send anything.
    Procedure:
    1. Call cargo_list_bases. Pick the base that matches the goal (s1_base = move stock A->B; s2_base = source materials from approved sites for production batches).
    2. Translate the goal into generator parameters and call cargo_make_spec. If the spec is invalid, report the problems and suggest which constraint to relax. Never invent another supplier: each material has one approved site.
    3. Call cargo_solve_plan. Every number you report must come from a tool result.
    4. Compare the four plans. Recommend one and say why in terms of cost, minimum slack, on-time probability and expected cost. If the cheapest plan is rarely on time, say so.
    5. If the user mentions a disruption (delay, airport, weather), use cargo_stress_test and/or the live tools before recommending.
    6. Call cargo_explain_plan once for the plan you recommend and include its brief under the heading "승인자 요약"; if unverified_numbers is not empty, say which numbers were not verified.
    Answer in the user's language. End with one line: RECOMMENDED: <run_id> <plan_name>.
